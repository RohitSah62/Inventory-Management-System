databases:
  - name: inventory-fifo-db
    databaseName: inventory_fifo
    user: inventory_user
    plan: free

services:
  - type: web
    name: inventory-fifo-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-fifo-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: AUTH_USERNAME
        value: admin
      - key: AUTH_PASSWORD
        generateValue: true
      - key: CORS_ORIGIN
        value: https://inventory-fifo-dashboard.onrender.com
      - key: KAFKA_TOPIC
        value: inventory-events
      - key: KAFKA_BROKERS
        sync: false
      - key: KAFKA_SSL
        value: "true"
      - key: KAFKA_SASL_MECHANISM
        value: scram-sha-256
      - key: KAFKA_SASL_USERNAME
        sync: false
      - key: KAFKA_SASL_PASSWORD
        sync: false

  - type: web
    name: inventory-fifo-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://inventory-fifo-api.onrender.com
